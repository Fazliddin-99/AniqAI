[project]
name = "accountant-backend"
version = "0.1.0"
description = "Оркестратор: пайплайн ЭСФ, классификатор проводок, API очереди ревью"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "anthropic>=0.116",
    "pydantic>=2.7",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "sqlalchemy>=2.0",
    "cryptography>=42",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "itsdangerous>=2.1",
    "copilot-shared",
    "matplotlib>=3.9",
]

[tool.uv.sources]
copilot-shared = { path = "../../packages/shared", editable = true }

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
