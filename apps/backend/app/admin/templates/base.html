<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Accountant Copilot — админка</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; background: #f6f7f9; color: #1a1a1a; }
    header { background: #1f2937; color: #fff; padding: 12px 20px; display: flex; gap: 16px; align-items: center; }
    header a { color: #cbd5e1; text-decoration: none; }
    header a:hover { color: #fff; }
    main { max-width: 900px; margin: 24px auto; padding: 0 16px; }
    table { width: 100%; border-collapse: collapse; background: #fff; border-radius: 8px; overflow: hidden; }
    th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid #eee; }
    th { background: #f0f2f5; font-size: 13px; color: #555; }
    .btn { display: inline-block; padding: 8px 14px; background: #2563eb; color: #fff; border: none;
           border-radius: 6px; text-decoration: none; cursor: pointer; font-size: 14px; }
    .btn.secondary { background: #6b7280; }
    form.card { background: #fff; padding: 20px; border-radius: 8px; max-width: 480px; }
    label { display: block; margin: 12px 0 4px; font-size: 14px; color: #444; }
    input, select { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
    .muted { color: #888; font-size: 13px; }
    .err { color: #b91c1c; }
    .badge-off { color: #b91c1c; }
    .badge-on { color: #15803d; }
  </style>
</head>
<body>
  {% if request.session.get('admin') %}
  <header>
    <strong>Copilot Admin</strong>
    <a href="/admin/companies">Компании</a>
    <a href="/admin/users">Пользователи</a>
    <a href="/admin/logout" style="margin-left:auto">Выйти</a>
  </header>
  {% endif %}
  <main>{% block content %}{% endblock %}</main>
</body>
</html>
