[project]
name = "copilot-shared"
version = "0.1.0"
description = "Общие контракты Accountant Copilot: операция, API 1С"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["copilot_shared"]
